spring.application.name=botica-biofarma-api
server.port=8080

# Conexion a SQL Server Local (configurable por variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=DB_BoticaBiofarma;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate (valida contra nuestras tablas del script SQL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuracion JWT (HU-01 y HU-02)
# Clave secreta configurable obligatoriamente via variable de entorno JWT_SECRET (HMAC-SHA256 >= 256 bits).
# Sin clave predeterminada conocida en configuracion principal para maxima seguridad.
jwt.secret=${JWT_SECRET:}
# Vigencia de token configurable via variable de entorno JWT_EXPIRATION_MS.
# 8 horas (28800000 ms), correspondiente al turno laboral de botica para el MVP academico.
jwt.expiration=${JWT_EXPIRATION_MS:28800000}

# Inicializacion segura de contraseña admin si el hash inicial está vacío (deshabilitado por defecto si no se define)
app.security.initial-admin-password=${INITIAL_ADMIN_PASSWORD:}
