
spring.application.name=botica-biofarma-api
server.port=8080

# Conexion a SQL Server Local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DB_BoticaBiofarma;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Biofarma123*
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate (valida contra nuestras tablas del script SQL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Clave secreta para Tokens JWT (HU-01)
jwt.secret=Biofarma2026ClaveSecretaSuperSeguraParaTokensJWT256Bits!
jwt.expiration=86400000