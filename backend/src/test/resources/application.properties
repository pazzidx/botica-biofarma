spring.application.name=botica-biofarma-api-test

# Base de datos en memoria H2 aislada para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DDL automático en H2 para pruebas de integración con JPA
spring.jpa.hibernate.ddl-auto=create-drop

# Deshabilitar Open-in-View en pruebas para coincidir con la arquitectura REST sin estado
spring.jpa.open-in-view=false

# Configuracion JWT para pruebas hermeticas
jwt.secret=claveSecretaDePruebaParaTestsDeIntegracion2026BiofarmaSegura!
jwt.expiration=28800000

# Password inicial admin para pruebas
app.security.initial-admin-password=AdminTemporal123*
